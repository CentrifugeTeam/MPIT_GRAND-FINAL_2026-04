services:
  # инфраструктура
  postgres-db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: postgres-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_db_data:/var/lib/postgresql/data
    ports:
      - "5446:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  main-db:
    image: postgres:15
    container_name: main-db
    environment:
      POSTGRES_DB: main_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_main_db_data:/var/lib/postgresql/data
    ports:
      - "5447:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main_db"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 45s

  # Один проход: DDL drivee_orders + заливка из CSV (лимит и skip из env). Ждёт готовность main-db.
  main-db-bootstrap:
    image: python:3.11-slim
    container_name: main-db-bootstrap
    restart: "no"
    working_dir: /work
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MAIN_DB_SEED_DSN: ${MAIN_DB_SEED_DSN:-postgresql://postgres:postgres@main-db:5432/main_db}
      MAIN_DB_CSV_PATH: ${MAIN_DB_CSV_PATH:-/work/dataset/train.csv}
      CSV_SEED_LIMIT: ${CSV_SEED_LIMIT:-1000}
    volumes:
      - ./:/work:ro
    networks:
      - app-network
    depends_on:
      main-db:
        condition: service_healthy
    command:
      - bash
      - -c
      - >-
        set -e;
        pip install -q 'psycopg[binary]';
        python /work/scripts/seed_main_db.py
        --dsn "$$MAIN_DB_SEED_DSN"
        --csv "$$MAIN_DB_CSV_PATH"
        --limit "$$CSV_SEED_LIMIT"
        --skip-if-count-ge "$$CSV_SEED_LIMIT"
        --wait-seconds 120

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # backend‑сервисы (минимальный набор)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
      target: development
    container_name: auth-service
    ports:
      - "8002:8002"
    environment:
      - SECRET_KEY=your-secret-key-here-dev
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres-db
      - DB_HOST=postgres-db
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - ./auth-service:/app
    networks:
      - app-network
    restart: unless-stopped

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
      target: development
    container_name: analytics-service
    ports:
      - "8009:8009"
    environment:
      - ANALYTICS_DATABASE_URL=${ANALYTICS_DATABASE_URL:-postgresql://postgres:postgres@main-db:5432/main_db}
      - PLATFORM_DATABASE_URL=${PLATFORM_DATABASE_URL:-postgresql://postgres:postgres@postgres-db:5432/postgres-db}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - SCHEMA_CACHE_TTL_SECONDS=${SCHEMA_CACHE_TTL_SECONDS:-86400}
      - SCHEMA_CRON_HOUR=${SCHEMA_CRON_HOUR:-3}
      - QUERY_TIMEOUT_MS=${QUERY_TIMEOUT_MS:-30000}
      - GLOBAL_MAX_ROWS=${GLOBAL_MAX_ROWS:-100000}
      - MAX_SQL_TEXT_BYTES=${MAX_SQL_TEXT_BYTES:-256000}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - INTERNAL_NL_CHAT_SYNC_TOKEN=${INTERNAL_NL_CHAT_SYNC_TOKEN:-dev-nl-chat-sync}
      - ANALYTICS_SOURCES_WRITE_TOKEN=${ANALYTICS_SOURCES_WRITE_TOKEN:-}
      - DEFAULT_ANALYTICS_SOURCE_KEY=${DEFAULT_ANALYTICS_SOURCE_KEY:-main-db}
      - ANALYTICS_SOURCES_INLINE=${ANALYTICS_SOURCES_INLINE:-main-db|postgresql://postgres:postgres@main-db:5432/main_db|Warehouse (main_db, drivee_orders)||postgres-main|postgresql://postgres:postgres@postgres-db:5432/postgres-db|Platform metadata (users, chats; no drivee_orders)}
    depends_on:
      postgres-db:
        condition: service_healthy
      main-db:
        condition: service_healthy
      main-db-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./analytics-service:/app
    networks:
      - app-network
    restart: unless-stopped

  report-task-service:
    build:
      context: ./report-task-service
      dockerfile: Dockerfile
      target: development
    container_name: report-task-service
    ports:
      - "8010:8010"
    environment:
      - PLATFORM_DATABASE_URL=${PLATFORM_DATABASE_URL:-postgresql://postgres:postgres@postgres-db:5432/postgres-db}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - REPORT_TASK_INTERNAL_TOKEN=${REPORT_TASK_INTERNAL_TOKEN:-dev-report-internal-token}
      - DISPATCH_INTERVAL_SECONDS=${DISPATCH_INTERVAL_SECONDS:-60}
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./report-task-service:/app
    networks:
      - app-network
    restart: unless-stopped

  sql-generator-worker:
    build:
      context: ./sql-generator-worker
      dockerfile: Dockerfile
    container_name: sql-generator-worker
    environment:
      - ANALYTICS_DATABASE_URL=${ANALYTICS_DATABASE_URL:-postgresql://postgres:postgres@main-db:5432/main_db}
      - PLATFORM_DATABASE_URL=postgresql://postgres:postgres@postgres-db:5432/postgres-db
      - DEFAULT_ANALYTICS_SOURCE_KEY=${DEFAULT_ANALYTICS_SOURCE_KEY:-main-db}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - QUERY_TIMEOUT_MS=${QUERY_TIMEOUT_MS:-30000}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - GLOBAL_MAX_ROWS=${GLOBAL_MAX_ROWS:-100000}
      - MAX_SQL_TEXT_BYTES=${MAX_SQL_TEXT_BYTES:-256000}
      - MAX_PLANNER_TOTAL_COST=${MAX_PLANNER_TOTAL_COST:-0}
      - EXPLAIN_TIMEOUT_MS=${EXPLAIN_TIMEOUT_MS:-5000}
      - QUERY_AUDIT_ENABLED=${QUERY_AUDIT_ENABLED:-true}
    depends_on:
      postgres-db:
        condition: service_healthy
      main-db:
        condition: service_healthy
      main-db-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  nl-orchestrator-worker:
    build:
      context: ./nl-orchestrator-worker
      dockerfile: Dockerfile
    container_name: nl-orchestrator-worker
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - CHAT_MAX_HISTORY_MESSAGES=${CHAT_MAX_HISTORY_MESSAGES:-40}
      - CHAT_SQL_MAX_ROWS=${CHAT_SQL_MAX_ROWS:-50000}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - ANALYTICS_SERVICE_URL=http://analytics-service:8009
      - AUTH_SERVICE_URL=http://auth-service:8002
      - INTERNAL_NL_CHAT_SYNC_TOKEN=${INTERNAL_NL_CHAT_SYNC_TOKEN:-dev-nl-chat-sync}
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - REPORT_TASK_SERVICE_URL=http://report-task-service:8010
      - REPORT_TASK_INTERNAL_TOKEN=${REPORT_TASK_INTERNAL_TOKEN:-dev-report-internal-token}
      - ORCH_GLOBAL_MAX_ROWS=${ORCH_GLOBAL_MAX_ROWS:-100000}
      - INTERPRET_CONFIDENCE_THRESHOLD=${INTERPRET_CONFIDENCE_THRESHOLD:-0.45}
    depends_on:
      rabbitmq:
        condition: service_healthy
      analytics-service:
        condition: service_started
      report-task-service:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  bff-service:
    build:
      context: ./bff-service
      dockerfile: Dockerfile
      target: development
    container_name: bff-service
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=your-secret-key-here-dev
      - ALGORITHM=HS256
      - AUTH_SERVICE_URL=http://auth-service:8002
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - ANALYTICS_SERVICE_URL=http://analytics-service:8009
      - REPORT_TASK_SERVICE_URL=http://report-task-service:8010
      - DEFAULT_ANALYTICS_SOURCE_KEY=${DEFAULT_ANALYTICS_SOURCE_KEY:-main-db}
      - NL_CHAT_BLOCKED_SOURCE_KEYS=${NL_CHAT_BLOCKED_SOURCE_KEYS:-postgres-main}
      - ANALYTICS_SOURCES_WRITE_TOKEN=${ANALYTICS_SOURCES_WRITE_TOKEN:-}
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - RABBITMQ_HOST=rabbitmq
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-120}
    depends_on:
      auth-service:
        condition: service_started
      analytics-service:
        condition: service_started
      report-task-service:
        condition: service_started
      nl-orchestrator-worker:
        condition: service_started
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./bff-service:/app
    networks:
      - app-network
    restart: unless-stopped

  notification-worker:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
      target: development
    container_name: notification-worker
    command: ["python", "email_worker.py"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres-db
      - DB_HOST=postgres-db
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - RABBITMQ_HOST=rabbitmq
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      notification-service:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
      target: development
    container_name: notification-service
    ports:
      - "8007:8007"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres-db
      - DB_HOST=postgres-db
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      bff-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  # CloudPub (запускается после nginx)
  cloudpub:
    image: cloudpub/cloudpub:latest
    platform: linux/amd64
    network_mode: "bridge"
    environment:
      - TOKEN=${CLOUDPUB_TOKEN}
    command: publish http host.docker.internal:80
    volumes:
      - cloudpub-config:/home/cloudpub/.cloudpub
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    restart: unless-stopped

volumes:
  cloudpub-config:
  rabbitmq_data:
  postgres_db_data:
  postgres_main_db_data:

networks:
  app-network:
    driver: bridge
