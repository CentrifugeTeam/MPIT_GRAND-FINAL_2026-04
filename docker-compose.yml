services:
  # инфраструктура
  postgres-db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: postgres-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_db_data:/var/lib/postgresql/data
    ports:
      - "5446:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-files:
    image: postgres:15
    container_name: postgres-files
    environment:
      POSTGRES_DB: files_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_files_data:/var/lib/postgresql/data
    ports:
      - "5447:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # backend‑сервисы (минимальный набор)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
      target: development
    container_name: auth-service
    ports:
      - "8002:8002"
    environment:
      - SECRET_KEY=your-secret-key-here-dev
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres-db
      - DB_HOST=postgres-db
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - ./auth-service:/app
    networks:
      - app-network
    restart: unless-stopped

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
      target: development
    container_name: analytics-service
    ports:
      - "8009:8009"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    environment:
      - ANALYTICS_DATABASE_URL=postgresql://postgres:postgres@postgres-db:5432/postgres-db
      - PLATFORM_DATABASE_URL=postgresql://postgres:postgres@postgres-db:5432/postgres-db
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - SCHEMA_CACHE_TTL_SECONDS=86400
      - SCHEMA_CRON_HOUR=3
      - QUERY_MAX_ROWS=500
      - QUERY_TIMEOUT_MS=30000
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./analytics-service:/app
    networks:
      - app-network
    restart: unless-stopped

  sql-generator-worker:
    build:
      context: ./sql-generator-worker
      dockerfile: Dockerfile
    container_name: sql-generator-worker
    environment:
      - ANALYTICS_DATABASE_URL=postgresql://postgres:postgres@postgres-db:5432/postgres-db
      - PLATFORM_DATABASE_URL=postgresql://postgres:postgres@postgres-db:5432/postgres-db
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - QUERY_MAX_ROWS=500
      - QUERY_TIMEOUT_MS=30000
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  bff-service:
    build:
      context: ./bff-service
      dockerfile: Dockerfile
      target: development
    container_name: bff-service
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=your-secret-key-here-dev
      - ALGORITHM=HS256
      - AUTH_SERVICE_URL=http://auth-service:8002
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - FILES_SERVICE_URL=http://files-service:8006
      - ANALYTICS_SERVICE_URL=http://analytics-service:8009
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      auth-service:
        condition: service_started
      files-service:
        condition: service_started
      analytics-service:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    volumes:
      - ./bff-service:/app
    networks:
      - app-network
    restart: unless-stopped

  files-service:
    build:
      context: ./files-service
      dockerfile: Dockerfile
    container_name: files-service
    ports:
      - "8006:8006"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-files:5432/files_db
      - STORAGE_PATH=/app/storage
      - MAX_FILE_SIZE=10485760
    depends_on:
      postgres-files:
        condition: service_healthy
    volumes:
      - ./files-service:/app
      - files_storage:/app/storage
    networks:
      - app-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
      target: development
    container_name: notification-service
    ports:
      - "8007:8007"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres-db
      - DB_HOST=postgres-db
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      bff-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    restart: unless-stopped

volumes:
  rabbitmq_data:
  postgres_db_data:
  postgres_files_data:
  files_storage:

networks:
  app-network:
    driver: bridge
