server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — все маршруты React Router отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
